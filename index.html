<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Catch Game</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f8ff;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #333;
            background-color: #fff;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas dimensions
        canvas.width = 400;
        canvas.height = 600;

        const emojis = ['🍎', '🍇', '🍓', '🍌', '🍍']; // Falling objects
        const basket = '🧺'; // Basket emoji

        let basketX = canvas.width / 2 - 20;
        let score = 0;
        let lives = 3;

        const fallingObjects = [];

        function createObject() {
            const emoji = emojis[Math.floor(Math.random() * emojis.length)];
            const x = Math.random() * (canvas.width - 30);
            fallingObjects.push({ emoji, x, y: -30 });
        }

        function drawBasket() {
            ctx.font = '30px Arial';
            ctx.fillText(basket, basketX, canvas.height - 50);
        }

        function drawObjects() {
            ctx.font = '30px Arial';
            for (const obj of fallingObjects) {
                ctx.fillText(obj.emoji, obj.x, obj.y);
            }
        }

        function updateObjects() {
            for (const obj of fallingObjects) {
                obj.y += 1.5; // Slowed down from 3 to 1.5
                
                if (obj.y > canvas.height - 50 && obj.x > basketX - 20 && obj.x < basketX + 40) {
                    score++;
                    fallingObjects.splice(fallingObjects.indexOf(obj), 1);
                } else if (obj.y > canvas.height) {
                    lives--;
                    fallingObjects.splice(fallingObjects.indexOf(obj), 1);
                }
            }
        }

        function drawScoreAndLives() {
            ctx.font = '20px Arial';
            ctx.fillStyle = '#000';
            ctx.fillText(`Score: ${score}`, 10, 20);
            ctx.fillText(`Lives: ${lives}`, canvas.width - 100, 20);
        }

        function gameOver() {
            ctx.font = '40px Arial';
            ctx.fillStyle = '#f00';
            ctx.fillText('Game Over!', canvas.width / 2 - 100, canvas.height / 2);
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (lives > 0) {
                drawBasket();
                drawObjects();
                drawScoreAndLives();
                updateObjects();

                requestAnimationFrame(gameLoop);
            } else {
                gameOver();
            }
        }

        // Move basket with arrow keys
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' && basketX > 0) {
                basketX -= 20;
            } else if (e.key === 'ArrowRight' && basketX < canvas.width - 40) {
                basketX += 20;
            }
        });

        // Start game with slower object creation interval
        setInterval(createObject, 2000); // Increased interval from 1000 to 2000ms
        gameLoop();
    </script>
</body>
</html>
