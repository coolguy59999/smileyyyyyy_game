<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Clicker Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f8ff;
        }

        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 600px;
            max-height: 600px;
            border: 2px solid #ccc;
            overflow: hidden;
            background-color: seagreen;
            border-radius: 10px;
        }

        .emoji {
            position: absolute;
            font-size: 48px;
            cursor: pointer;
        }

        .score-board {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 24px;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div class="game-container">
        <div class="score-board">Score: <span id="score">0</span></div>
        <div class="emoji" id="emoji">😄</div>
    </div>

    <script>
        const emojiElement = document.getElementById("emoji");
        const scoreElement = document.getElementById("score");
        const gameContainer = document.querySelector(".game-container");

        let score = 0;

        // Move emoji to a random position
        function moveEmoji() {
            const maxX = gameContainer.clientWidth - emojiElement.offsetWidth;
            const maxY = gameContainer.clientHeight - emojiElement.offsetHeight;

            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            emojiElement.style.left = `${randomX}px`;
            emojiElement.style.top = `${randomY}px`;
        }

        // Update score when emoji is clicked
        emojiElement.addEventListener("click", () => {
            score++;
            scoreElement.textContent = score;
            moveEmoji();
        });

        // Change emoji position every 1 second
        setInterval(() => {
            moveEmoji();
        }, 1000);

        // Initial position
        moveEmoji();
    </script>
</body>

</html>
